name: Mantenimiento Mensual de Base de Datos

on:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: licitaciones-data-sync
  cancel-in-progress: false

jobs:
  vacuum-db:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adjudica
    env:
      ADJUDICA_INSTANCE_ROOT: ${{ github.workspace }}
      ADJUDICA_DB_PATH: ${{ github.workspace }}/data/licitaciones_alcazar.db
      ADJUDICA_AUTHORITIES_CONFIG_PATH: ${{ github.workspace }}/data/contracting-authorities.json
      ADJUDICA_CATALOG_DIR: ${{ github.workspace }}/data/catalogs
      ADJUDICA_RAW_DIR: ${{ github.workspace }}/data_raw
      ADJUDICA_HISTORICAL_DATA_PATH: ${{ github.workspace }}/data/historical-sources.json
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          ref: master
          persist-credentials: false

      - name: Configurar pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Configurar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache-dependency-path: adjudica/pnpm-lock.yaml
          node-version: 24
          cache: 'pnpm'

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Aplicar migraciones de base de datos
        run: |
          set -Eeuo pipefail
          pnpm run migrate-db
          pnpm run init-db
          pnpm run migrate-verified-contract-metadata

      - name: Compactar base de datos
        run: pnpm run vacuum-db

      - name: Validar base de datos
        run: pnpm run validate-db

      - name: Hacer commit y push si hay cambios
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "GitHub Action [Bot]"
          git config user.email "action@github.com"
          git add data/licitaciones_alcazar.db
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): mantenimiento mensual de base de datos [skip ci]"
            git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push
          fi
