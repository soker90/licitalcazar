name: Actualización Mensual de Subvenciones

on:
  schedule:
    # Una vez al mes, el día 1 a las 05:00 UTC.
    - cron: '0 5 1 * *'
  workflow_dispatch: # Permite ejecución manual desde GitHub

permissions:
  contents: write

concurrency:
  group: licitaciones-data-sync
  cancel-in-progress: false

jobs:
  update-subvenciones:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          persist-credentials: false

      - name: Configurar pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Configurar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Sincronizar subvenciones BDNS
        env:
          DNI_SALT: ${{ secrets.DNI_SALT }}
        run: |
          set -Eeuo pipefail
          pnpm run migrate-db
          pnpm run migrate-verified-contract-metadata
          pnpm run sync-subvenciones
          pnpm run validate-db

      - name: Validar base de datos y tests antes del commit
        run: |
          set -Eeuo pipefail
          pnpm test
          pnpm run validate-db

      - name: Hacer commit y push si hay cambios
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "GitHub Action [Bot]"
          git config user.email "action@github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): actualizar subvenciones BDNS [skip ci]"
            git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push
          fi
