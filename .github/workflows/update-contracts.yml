name: Actualización Automática de Licitaciones

on:
  schedule:
    # Se ejecuta todos los domingos a las 04:00 UTC
    - cron: '0 4 * * 0'
  workflow_dispatch: # Permite ejecución manual desde GitHub

permissions:
  contents: write

concurrency:
  group: licitaciones-data-sync
  cancel-in-progress: false

jobs:
  update-contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adjudica
    env:
      ADJUDICA_INSTANCE_ROOT: ${{ github.workspace }}
      ADJUDICA_DB_PATH: ${{ github.workspace }}/data/licitaciones_alcazar.db
      ADJUDICA_AUTHORITIES_CONFIG_PATH: ${{ github.workspace }}/data/contracting-authorities.json
      ADJUDICA_CATALOG_DIR: ${{ github.workspace }}/data/catalogs
      ADJUDICA_RAW_DIR: ${{ github.workspace }}/data_raw
      ADJUDICA_HISTORICAL_DATA_PATH: ${{ github.workspace }}/data/historical-sources.json
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          ref: master
          persist-credentials: false

      - name: Configurar pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Configurar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache-dependency-path: adjudica/pnpm-lock.yaml
          node-version: 24
          cache: 'pnpm'

      - name: Instalar dependencias del sistema
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Ejecutar sincronización incremental semanal
        env:
          DNI_SALT: ${{ secrets.DNI_SALT }}
        run: |
          set -Eeuo pipefail
          pnpm run migrate-db
          pnpm run migrate-contracting-authorities-config
          pnpm run migrate-corporate-groups
          pnpm run migrate-cif-corrections
          pnpm run migrate-verified-person-mappings
          pnpm run migrate-corporate-name-history
          pnpm run migrate-contract-identifiers
          YEAR="$(date -u +%Y)"
          echo "📅 Sincronizando el año actual: ${YEAR}"

          # UPSERT por expediente + órgano; los lotes solo se sustituyen cuando
          # PLACSP entrega una estructura explícita. Repetir el job es idempotente.
          pnpm run sync -- --year="${YEAR}" --download
          pnpm run migrate-verified-contract-seeds
          pnpm run migrate-naturaleza-economica
          pnpm run sync-modificaciones -- --year="${YEAR}"
          pnpm run migrate-verified-repairs
          pnpm run repair-verified-data
          pnpm run sync-documentos
          # Re-evaluar importes publicados como aparentes precios unitarios
          # después de sincronizar los documentos que aportan la evidencia.
          pnpm exec node scripts/classify-award-amount-documents.js
          pnpm exec node scripts/anonymize-personal-nifs.js
          pnpm run refresh-resolutions -- --skip-vacuum
          pnpm run optimize-db -- --skip-vacuum
          pnpm run validate-db

      - name: Validar base de datos y tests antes del commit
        run: |
          set -Eeuo pipefail
          pnpm test
          pnpm run validate-db

      - name: Hacer commit y push si hay cambios
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "GitHub Action [Bot]"
          git config user.email "action@github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): actualizar licitaciones Alcázar de San Juan [skip ci]"
            git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push
          fi
