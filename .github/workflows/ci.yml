name: CI

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.3.0
          run_install: false

      - name: Configurar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Aplicar migraciones de base de datos
        run: pnpm run migrate-db

      - name: Inicializar esquema y catálogos de base de datos
        run: pnpm run init-db

      - name: Aplicar datos contractuales verificados
        run: |
          pnpm run migrate-verified-contract-seeds
          pnpm run migrate-verified-repairs
          pnpm run repair-verified-data
          pnpm run migrate-verified-contract-metadata

      - name: Verificar esquema físico canónico
        run: pnpm exec vitest run scripts/canonical-schema.test.mjs

      - name: Actualizar naturaleza económica de la BD de CI
        run: pnpm run migrate-naturaleza-economica

      - name: Clasificar importes de adjudicación de la BD de CI
        run: pnpm run migrate-award-amount-type

      - name: Validar base de datos canónica
        run: pnpm run validate-db

      - name: Lint
        run: pnpm lint

      - name: Tests
        run: pnpm test

      - name: Build
        env:
          DNI_SALT: ${{ secrets.DNI_SALT }}
        run: pnpm build
